<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face-api.js Test - San Isidro</title>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
    }
    
    h1 {
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }
    
    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .status {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .status.loading {
      background: #e3f2fd;
      color: #1976d2;
    }
    
    .status.success {
      background: #e8f5e9;
      color: #388e3c;
    }
    
    .status.error {
      background: #ffebee;
      color: #d32f2f;
    }
    
    .video-container {
      position: relative;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    
    #video {
      width: 100%;
      display: block;
    }
    
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    
    .badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 15px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .badge.detected {
      background: #4caf50;
    }
    
    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    button {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-secondary {
      background: #f5f5f5;
      color: #333;
    }
    
    .btn-danger {
      background: #f44336;
      color: white;
    }
    
    .info {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 10px;
      font-size: 12px;
      color: #666;
    }
    
    .info-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    
    .info-item:last-child {
      margin-bottom: 0;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎭 Face-api.js Test</h1>
    <p class="subtitle">Testing facial recognition for San Isidro Attendance System</p>
    
    <div id="status" class="status loading">
      <span class="spinner"></span>
      <span>Loading face recognition models...</span>
    </div>
    
    <div class="video-container">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="canvas"></canvas>
      <div id="badge" class="badge">Camera Off</div>
    </div>
    
    <div class="controls">
      <button id="startBtn" class="btn-primary" disabled>Start Camera</button>
      <button id="captureBtn" class="btn-secondary" disabled>Capture Face</button>
      <button id="stopBtn" class="btn-danger" disabled>Stop Camera</button>
    </div>
    
    <div class="info">
      <div class="info-item">
        <span>📊 Models Loaded:</span>
        <span id="modelsStatus">0/3</span>
      </div>
      <div class="info-item">
        <span>👤 Faces Detected:</span>
        <span id="facesCount">0</span>
      </div>
      <div class="info-item">
        <span>⚡ Detection Speed:</span>
        <span id="fps">0 FPS</span>
      </div>
      <div class="info-item">
        <span>🎯 Last Confidence:</span>
        <span id="confidence">N/A</span>
      </div>
    </div>
  </div>
  
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const badge = document.getElementById('badge');
    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const captureBtn = document.getElementById('captureBtn');
    const stopBtn = document.getElementById('stopBtn');
    
    let stream = null;
    let detectionInterval = null;
    let lastDetectionTime = Date.now();
    let frameCount = 0;
    
    // Load models
    async function loadModels() {
      try {
        const MODEL_URL = '/models';
        
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        document.getElementById('modelsStatus').textContent = '1/3';
        
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        document.getElementById('modelsStatus').textContent = '2/3';
        
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        document.getElementById('modelsStatus').textContent = '3/3';
        
        status.className = 'status success';
        status.innerHTML = '✅ Models loaded successfully! Ready to start camera.';
        startBtn.disabled = false;
      } catch (error) {
        status.className = 'status error';
        status.innerHTML = `❌ Error loading models: ${error.message}`;
        console.error(error);
      }
    }
    
    // Start camera
    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: 'user', width: 640, height: 480 } 
        });
        video.srcObject = stream;
        
        // Wait for video to load
        await new Promise(resolve => {
          video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            resolve();
          };
        });
        
        badge.textContent = 'Detecting...';
        badge.className = 'badge';
        startBtn.disabled = true;
        captureBtn.disabled = false;
        stopBtn.disabled = false;
        
        status.className = 'status success';
        status.innerHTML = '📹 Camera started. Position your face in the frame.';
        
        // Start detection loop
        detectFaces();
      } catch (error) {
        status.className = 'status error';
        status.innerHTML = `❌ Camera error: ${error.message}`;
      }
    }
    
    // Stop camera
    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.srcObject = null;
      
      if (detectionInterval) {
        clearInterval(detectionInterval);
      }
      
      badge.textContent = 'Camera Off';
      badge.className = 'badge';
      startBtn.disabled = false;
      captureBtn.disabled = true;
      stopBtn.disabled = true;
      
      status.className = 'status';
      status.innerHTML = 'Camera stopped.';
      
      // Clear canvas
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
    
    // Detect faces
    async function detectFaces() {
      try {
        const detections = await faceapi
          .detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptors();
        
        // Clear canvas
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Draw detections
        if (detections.length > 0) {
          badge.textContent = `${detections.length} Face(s) Detected`;
          badge.className = 'badge detected';
          
          const displaySize = { width: video.videoWidth, height: video.videoHeight };
          const resizedDetections = faceapi.resizeResults(detections, displaySize);
          
          faceapi.draw.drawDetections(canvas, resizedDetections);
          faceapi.draw.drawFaceLandmarks(canvas, resizedDetections);
          
          document.getElementById('facesCount').textContent = detections.length;
          document.getElementById('confidence').textContent = 
            `${(detections[0].detection.score * 100).toFixed(1)}%`;
        } else {
          badge.textContent = 'No Face Detected';
          badge.className = 'badge';
          document.getElementById('facesCount').textContent = '0';
        }
        
        // Calculate FPS
        frameCount++;
        const now = Date.now();
        if (now - lastDetectionTime >= 1000) {
          document.getElementById('fps').textContent = `${frameCount} FPS`;
          frameCount = 0;
          lastDetectionTime = now;
        }
        
        // Continue detection
        if (stream) {
          requestAnimationFrame(detectFaces);
        }
      } catch (error) {
        console.error('Detection error:', error);
      }
    }
    
    // Capture face
    async function captureFace() {
      try {
        const detection = await faceapi
          .detectSingleFace(video, new faceapi.TinyFaceDetectorOptions())
          .withFaceLandmarks()
          .withFaceDescriptor();
        
        if (!detection) {
          status.className = 'status error';
          status.innerHTML = '❌ No face detected. Please position your face in the frame.';
          return;
        }
        
        const descriptor = Array.from(detection.descriptor);
        
        status.className = 'status success';
        status.innerHTML = `✅ Face captured! Descriptor: 128 dimensions, Confidence: ${(detection.detection.score * 100).toFixed(1)}%`;
        
        console.log('Face Descriptor:', descriptor);
        console.log('Descriptor Length:', descriptor.length);
        console.log('Detection Score:', detection.detection.score);
      } catch (error) {
        status.className = 'status error';
        status.innerHTML = `❌ Capture error: ${error.message}`;
      }
    }
    
    // Event listeners
    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopCamera);
    captureBtn.addEventListener('click', captureFace);
    
    // Wait for face-api.js to load, then load models
    if (typeof faceapi !== 'undefined') {
      loadModels();
    } else {
      window.addEventListener('load', () => {
        if (typeof faceapi !== 'undefined') {
          loadModels();
        } else {
          status.className = 'status error';
          status.innerHTML = '❌ Failed to load face-api.js library. Please check your internet connection.';
        }
      });
    }
  </script>
</body>
</html>
